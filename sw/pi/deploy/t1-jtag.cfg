# OpenOCD 0.12.0, Pi 4 native GPIO adapter. Use only through fpga.py's
# isolated/locked ownership context; never run alongside the SPI6 driver.
adapter driver bcm2835gpio
bcm2835gpio peripheral_base 0xFE000000
# Conservative calibration for the stock Pi 4 at up to 1.5 GHz.
bcm2835gpio speed_coeffs 236181 60
bcm2835gpio jtag_nums 21 16 20 19
transport select jtag
adapter speed 100
reset_config none
jtag newtap xc7 tap -irlen 6 -ignore-version -expected-id 0x03636093
pld device virtex2 xc7.tap 1
